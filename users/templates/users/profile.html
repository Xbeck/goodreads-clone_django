{% extends "base.html" %}

	{% block title %}Profile Page{% endblock title %}
	
	{% block content %}
		
		<h3>Profile</h3>


				<div class="image d-flex flex-column justify-content-center align-items-center"> 
					<button class="btn btn-secondary">
						<a href="{{ user.profile_picture.url }}"><img class="profile-pic"  alt="Profile picture" src="{{ user.profile_picture.url }}"></a>
					</button>
					<span class="name mt-3">{{ user.first_name }} {{ user.last_name }}</span> 
					<span class="idd">@{{ user.username }}</span> 
					<span class="idd">{{ user.email }}</span> 
					<div class=" d-flex mt-2"> 
						<a class="btn btn-dark" href="{% url 'users:profile-edit'%}" style="text-decoration: none;">Edit Profile</a>
					</div> 
					<div class="gap-3 mt-3 icons d-flex flex-row justify-content-center align-items-center">
						<span><i class="fa fa-twitter"></i></span>
						<span><i class="fa fa-facebook-f"></i></span>
						<span><i class="fa fa-instagram"></i></span>
						<span><i class="fa fa-linkedin"></i></span>
					</div>
					<div class=" px-2 rounded mt-4 date ">
						<span class="join">Joined {{ user.date_joined | date:"M, d, Y"}}</span>
					</div>
				</div>



	
		<!-- <div>
			<a href="{% url 'users:profile-edit'%}">edit profile</a>
		</div>
		

		<p>Username: {{ user.username }}</p>
		<p>First Name: {{ user.first_name }}</p>
		<p>Last Name: {{ user.last_name }}</p>
		<p>Email: {{ user.email }}</p> -->

	{% endblock content %}
